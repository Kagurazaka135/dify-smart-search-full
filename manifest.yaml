version: 0.0.5
type: plugin
author: kagurazaka135
name: smart-search-full
label:
  en_US: Smart Search (Full)
  zh_Hans: 智能搜索（满血版）
  ja_JP: スマート検索（フル）
  pt_BR: Busca Inteligente (Completo)
description:
  en_US: Multi-round LLM-driven web search engine tool with query expansion, quality scoring and structured summarization. Six search backends with automatic fallback.
  zh_Hans: 多轮 LLM 驱动的网页搜索引擎工具——自动拆词、评质、换词重搜，输出结构化正反方汇总，六个搜索后端自动降级。
  ja_JP: マルチラウンドの LLM 駆動ウェブ検索エンジンツール。クエリ拡張、品質評価、構造化要約、6 つのバックエンド自動フォールバック対応。
  pt_BR: Ferramenta de motor de busca web em múltiplas rodadas com expansão de consulta, avaliação de qualidade, resumo estruturado e seis backends com fallback automático.
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
plugins:
  tools:
    - provider/smart_search_full.yaml
meta:
  version: 0.0.5
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: "1.0.0"
created_at: 2026-10-11T01:20:00+08:00
privacy: PRIVACY.md
repo: https://github.com/Kagurazaka135/dify-smart-search-full
